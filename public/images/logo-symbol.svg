<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Smooth drop shadows for 3D depth -->
    <filter id="cubeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0B1320" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#cubeShadow)">
    <!-- ========================================== -->
    <!-- 1. TOP FACE (Deep Midnight Navy #1E2D56) -->
    <!-- ========================================== -->
    <g id="top-face">
      <!-- Main Rhombus Body with cutouts & tabs -->
      <!-- Center is at (250, 230). Top vertex at (250, 95). Left vertex at (135, 160). Right vertex at (365, 160) -->
      <path d="
        M 250 95
        L 295 120
        C 298 108 308 100 320 102
        C 334 104 342 118 338 132
        C 334 142 324 148 314 145
        L 365 160
        L 320 186
        C 316 174 306 166 294 168
        C 280 170 272 184 276 198
        C 280 208 290 214 300 211
        L 250 230
        L 205 204
        C 209 216 219 224 231 222
        C 245 220 253 206 249 192
        C 245 182 235 176 225 179
        L 135 160
        L 186 145
        C 176 148 166 142 162 132
        C 158 118 166 104 180 102
        C 192 100 202 108 205 120
        Z
      " fill="#1E2E59" />

      <!-- Top Outer Outward Tabs -->
      <!-- Top-Left Tab -->
      <circle cx="178" cy="118" r="19" fill="#1E2E59" />
      <!-- Top-Right Tab -->
      <circle cx="322" cy="118" r="19" fill="#1E2E59" />

      <!-- Top Corner Sockets (White Cutout circles) -->
      <circle cx="250" cy="95" r="16" fill="#FFFFFF" />
      <!-- Front-Right Tab on Top Face connecting to Right Face -->
      <circle cx="308" cy="198" r="18" fill="#1E2E59" />
      <!-- Front-Left Socket on Top Face -->
      <circle cx="192" cy="198" r="17" fill="#FFFFFF" />
    </g>


    <!-- ========================================== -->
    <!-- 2. LEFT FACE (Light Steel Blue #8EAAD4) -->
    <!-- ========================================== -->
    <g id="left-face">
      <!-- Left Face Base Polygon: (135, 166) to (245, 236) to (245, 375) to (135, 305) -->
      <polygon points="135,166 245,236 245,375 135,305" fill="#8EAAD4" />

      <!-- Outer-Left Outward Tab -->
      <circle cx="112" cy="235" r="20" fill="#8EAAD4" />

      <!-- Bottom-Left Outward Tab -->
      <circle cx="190" cy="340" r="20" fill="#8EAAD4" />

      <!-- Top-Left Joint Tab (connecting to top face socket) -->
      <circle cx="192" cy="198" r="16.5" fill="#8EAAD4" />

      <!-- Center-Right Vertical Line Socket (indentation for right face tab) -->
      <circle cx="245" cy="305" r="18" fill="#FFFFFF" />

      <!-- Bottom Outer Socket -->
      <circle cx="135" cy="305" r="17" fill="#FFFFFF" />
    </g>


    <!-- ========================================== -->
    <!-- 3. RIGHT FACE (Terracotta Red #A33F2E) -->
    <!-- ========================================== -->
    <g id="right-face">
      <!-- Right Face Base Polygon: (255, 236) to (365, 166) to (365, 305) to (255, 375) -->
      <polygon points="255,236 365,166 365,305 255,375" fill="#A33F2E" />

      <!-- Outer-Right Outward Tab -->
      <circle cx="388" cy="235" r="20" fill="#A33F2E" />

      <!-- Bottom-Right Outward Tab -->
      <circle cx="310" cy="340" r="20" fill="#A33F2E" />

      <!-- Center Vertical Tab interlocking into Left Face Socket -->
      <circle cx="245" cy="305" r="17.5" fill="#A33F2E" />

      <!-- Top Meeting Joint Socket -->
      <circle cx="308" cy="198" r="17" fill="#FFFFFF" />

      <!-- Bottom Outer Socket -->
      <circle cx="365" cy="305" r="17" fill="#FFFFFF" />
    </g>

    <!-- Center White Axis Joint Gap Accent -->
    <circle cx="250" cy="236" r="8" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
